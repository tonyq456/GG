<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#182b43"><title>率土戰鬥研究所</title><style>body{margin:0;background:#101c2d;color:#eef2f7;font-family:system-ui;padding:18px;max-width:850px;margin:auto}h1{font-size:25px}section{background:#203249;padding:16px;border-radius:14px;margin:12px 0}select,button,input{padding:10px;border-radius:8px;margin:4px;background:#fff;color:#15243b;max-width:100%}button{background:#e3b96a;border:0;font-weight:bold}label{display:inline-block;margin:8px}small{color:#f5d28e}pre{white-space:pre-wrap;background:#101c2d;padding:12px;border-radius:10px;max-height:480px;overflow:auto}</style></head><body><h1>⚔ 率土戰鬥研究所</h1><small>v0.1 試驗模型｜非官方台服數據；所有戰鬥數值均為可替換的示範假設。</small><section><h2>三武將配隊</h2><div id="slots"></div></section><section><h2>模擬設定</h2><label>模擬次數 <select id="runs"><option>1</option><option>100</option><option>1000</option></select></label><label>亂數種子 <input id="seed" type="number" value="2026"></label><button id="run">模擬八回合</button></section><section><h2>結果</h2><div id="summary">尚未開始</div><pre id="report"></pre><button id="export">匯出 JSON 戰報</button></section><script>
const generals=['張角','法正','曹操','孫權','荀彧','太史慈'],tactics=['戰必斷金','不攻','反計之策','三軍之眾','大賞三軍','神兵天降','眾謀不懈','渾水摸魚'],positions=['大營','中軍','前鋒'];let latest=null;
const opts=(arr,selected)=>arr.map(v=>'<option '+(v===selected?'selected':'')+'>'+v+'</option>').join('');
document.querySelector('#slots').innerHTML=positions.map((p,i)=>'<div><b>'+p+'</b><label>武將<select id="g'+i+'">'+opts(generals,['張角','法正','曹操'][i])+'</select></label><label>戰法①<select id="a'+i+'">'+opts(tactics,[ '眾謀不懈','神兵天降','戰必斷金'][i])+'</select></label><label>戰法②<select id="b'+i+'">'+opts(tactics,['不攻','大賞三軍','反計之策'][i])+'</select></label></div>').join('');
function rand(seed){return()=>{seed=(Math.imul(1664525,seed)+1013904223)>>>0;return seed/4294967296}}
function simulate(team,rng){let hp=[10000,10000,10000],enemy=30000,log=[],damage=0,heal=0;for(let round=1;round<=8;round++){log.push('第 '+round+' 回合');for(let i=0;i<3;i++){if(hp[i]<=0)continue;let g=team[i],base={張角:850,法正:220,曹操:320,孫權:310,荀彧:700,太史慈:650}[g.name];let dealt=Math.round(base*(.65+rng()*.7));let triggered=[];for(const t of g.tactics){if(rng()<.35){triggered.push(t);if(t==='眾謀不懈'||t==='不攻')dealt=Math.round(dealt*1.2);if(t==='三軍之眾'){let h=400+Math.floor(rng()*400);hp[i]=Math.min(10000,hp[i]+h);heal+=h}}}enemy=Math.max(0,enemy-dealt);damage+=dealt;log.push(g.name+' 傷害 '+dealt+(triggered.length?'｜觸發：'+triggered.join('、'):'')+'｜敵軍 '+enemy);if(enemy===0)break}if(enemy===0)break;for(let i=0;i<3;i++){let loss=Math.round(250+rng()*450);hp[i]=Math.max(0,hp[i]-loss)}log.push('我軍剩餘兵力：'+hp.join(' / '))}return{damage,heal,enemy,hp,log}}
document.querySelector('#run').onclick=()=>{const team=positions.map((p,i)=>({position:p,name:document.querySelector('#g'+i).value,tactics:[document.querySelector('#a'+i).value,document.querySelector('#b'+i).value]}));const names=team.map(x=>x.name);if(new Set(names).size!==3){alert('請選擇三名不同武將');return}const n=+document.querySelector('#runs').value,rng=rand(+document.querySelector('#seed').value||1),results=Array.from({length:n},()=>simulate(team,rng));latest={version:'0.1',disclaimer:'示範模型，非官方公式或實測勝率',team,results};let avg=results.reduce((s,r)=>s+r.damage,0)/n;document.querySelector('#summary').textContent='模擬 '+n+' 場｜平均輸出 '+avg.toFixed(0)+'｜示範模型';document.querySelector('#report').textContent=results[0].log.join('\n')};
document.querySelector('#export').onclick=()=>{if(!latest){alert('請先模擬');return}let a=document.createElement('a'),u=URL.createObjectURL(new Blob([JSON.stringify(latest,null,2)],{type:'application/json'}));a.href=u;a.download='stzb-report.json';a.click();URL.revokeObjectURL(u)};
</script></body></html>
